# navbar
title: "Portfolio - Lucy Inett"
description: "MEng Computer Science Student interested in the future of intelligent technology."
url: "https://lucyinett.co.uk"
baseurl: ""                 

# Use Minimal Mistakes remote theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# Logo in navbar
logo: "/assets/img/logo.png"

# Optional site settings
breadcrumbs: false
locale: en-GB

# Social links (show in header/footer if enabled)
author:
  name: "Lucy Inett"
  avatar: "/assets/img/avatar.png"   # profile photo
  bio: "MEng Computer Science Student interested in the future of intelligent technology."
  location: "UK"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:lucyinett@protonmail.com"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/lucyinett"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/in/lucyinett"

# Plugins GitHub Pages supports
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-include-cache

# Build settings
markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: "/page:num/"

collections:
  projects:
    output: true
    permalink: /projects/:name/
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      classes: wide
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide
